name: Discover DB Schema

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: DB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Discover schema
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          DBNAME: ${{ secrets.DBNAME }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          python -m manual_attendance.discover_schema
          python -m manual_attendance.probe_learners
