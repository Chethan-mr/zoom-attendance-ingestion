name: Sync Manual Attendance Cache

on:
  schedule:
    - cron: "15 * * * *"   # Hourly, shortly after Zoom job
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: DB

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build programs/learners cache
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          DBNAME: ${{ secrets.DBNAME }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python -m manual_attendance.sync_cache

      - name: Commit cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual_attendance_cache.json
          if git diff --staged --quiet; then
            echo "No cache changes"
          else
            git commit -m "chore: refresh manual attendance cache [skip ci]"
            git push
          fi
