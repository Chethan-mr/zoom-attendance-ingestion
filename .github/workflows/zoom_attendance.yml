name: Hourly Zoom Attendance

on:
  schedule:
    - cron: "0 * * * *"   # Every hour
  workflow_dispatch:
    inputs:
      mode:
        description: "Attendance mode (scheduled runs always use zoom)"
        required: false
        default: zoom
        type: choice
        options:
          - zoom

jobs:
  run:
    runs-on: ubuntu-latest
    environment: DB

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Zoom Attendance
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'zoom' || inputs.mode == '' }}
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          DBNAME: ${{ secrets.DBNAME }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}

          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}

          GOOGLE_WEBHOOKS: ${{ secrets.GOOGLE_WEBHOOKS }}

        run: python zoom_attendance_to_db.py
